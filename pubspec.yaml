name: thrifty
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter_svg: ^2.3.0
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/thrifty_icon.svg
  fonts:
    - family: Epilogue
      fonts:
        - asset: assets/fonts/Epilogue-Variable.ttf
          weight: 400
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 400
