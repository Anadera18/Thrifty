[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thrifty-api"
version = "0.1.0"
description = "API for the Thrifty secondhand clothing marketplace"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi[standard]>=0.115,<1",
  "geoalchemy2>=0.17,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
